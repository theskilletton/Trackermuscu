<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111418">
<title>Programme muscu</title>
<style>
  :root {
    --bg: #111418;
    --card: #1b2027;
    --card-done: #17251d;
    --line: #2a313b;
    --text: #e8ebef;
    --muted: #8b95a3;
    --accent: #4fa3ff;
    --ok: #3ecf7a;
    --warn: #f0b04a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 60px; }
  h1 { font-size: 1.4rem; margin: 4px 0 2px; }
  h2 { font-size: 1.1rem; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: .9rem; }

  nav { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0; scrollbar-width: none; }
  nav button {
    flex: 0 0 auto;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: .9rem;
    cursor: pointer;
  }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  nav button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: 6px; vertical-align: middle; }

  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin: 6px 0 10px; }
  .bar { height: 8px; background: var(--card); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .bar > div { height: 100%; background: var(--ok); width: 0; transition: width .25s; }

  .ex {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
    transition: background .2s;
  }
  .ex.done { background: var(--card-done); border-color: #24452f; }
  .ex label.top { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
  .ex input[type=checkbox] { width: 24px; height: 24px; margin: 2px 0 0; accent-color: var(--ok); flex: 0 0 auto; }
  .ex .name { font-weight: 600; }
  .ex.done .name { text-decoration: line-through; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: .8rem; background: #232a33; border-radius: 6px; padding: 2px 8px; color: var(--muted); }
  .chip.main { color: var(--text); }
  .tip { font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .perf { margin-top: 10px; padding-left: 36px; }
  .perf input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 10px;
    font-size: .95rem;
  }
  .last { font-size: .8rem; color: var(--accent); margin-top: 4px; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .btn {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 10px;
    padding: 11px 16px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 500; }
  .status { margin-top: 10px; font-size: .9rem; min-height: 1.2em; }
  .status.ok { color: var(--ok); }
  .status.warn { color: var(--warn); }

  section.hist { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 16px; }
  .entry { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .entry summary { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  .entry ul { margin: 8px 0 2px; padding-left: 18px; font-size: .88rem; }
  .entry li.skip { color: var(--muted); }
  .entry .del { margin-top: 8px; font-size: .8rem; background: none; border: 0; color: #e46a6a; cursor: pointer; padding: 0; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 10px 0 4px; }
  .day { text-align: center; font-size: .72rem; color: var(--muted); }
  .day b { display: block; margin: 3px auto 0; width: 26px; height: 26px; border-radius: 50%; line-height: 26px; background: var(--card); color: var(--muted); font-size: .75rem; }
  .day b.on { background: var(--ok); color: #0c1a12; }
  .day.today { color: var(--text); font-weight: 600; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Programme prise de muscle</h1>
  <div class="muted">Full body 3×/semaine · séance maison · gainage</div>

  <div class="week" id="week"></div>

  <nav id="tabs"></nav>

  <div class="head">
    <div>
      <h2 id="title"></h2>
      <div class="muted" id="subtitle"></div>
    </div>
    <div class="muted" id="count"></div>
  </div>
  <div class="bar"><div id="progress"></div></div>

  <div id="list"></div>

  <div class="actions">
    <button class="btn" id="finish">Terminer la séance</button>
    <button class="btn ghost" id="reset">Tout décocher</button>
  </div>
  <div class="status" id="status"></div>

  <section class="hist">
    <h2>Historique</h2>
    <div class="muted">Enregistré dans ce navigateur. Exporte de temps en temps pour ne rien perdre.</div>
    <div class="actions">
      <button class="btn ghost" id="export">Exporter (.json)</button>
      <button class="btn ghost" id="importBtn">Importer</button>
      <input type="file" id="importFile" accept="application/json,.json">
    </div>
    <div id="history" style="margin-top:12px"></div>
  </section>
</div>

<script>
// ---------------------------------------------------------------
// LE PROGRAMME — modifie ici si tu changes un exercice ou un jour.
// weekday : 0 = dimanche, 1 = lundi, ... 6 = samedi
// ---------------------------------------------------------------
const PROGRAMME = [
  {
    id: "maison", court: "Lun · Maison", titre: "Séance maison (chaise romaine)",
    jour: "Lundi", weekday: 1, duree: "30 min",
    exercices: [
      { nom: "Tractions, prise pronation largeur d'épaules", series: "4 × max (1–2 reps en réserve)", repos: "2 min", tip: "Moins de 5 reps : 4 × 3–5 négatives (descente en 4–5 s) ou élastique. À 4 × 10 propres, ajoute du lest." },
      { nom: "Dips (ou pompes)", series: "3 × 8–12", repos: "1 min 30", tip: "Buste légèrement penché en avant pour les pecs." },
      { nom: "Relevés de jambes sur appui coudes", series: "3 × 10–15", repos: "1 min", tip: "Enroule le bassin vers le haut. Genoux pliés d'abord, puis jambes tendues." }
    ]
  },
  {
    id: "A", court: "Mar · A", titre: "Séance A — dominante squat / couché",
    jour: "Mardi soir", weekday: 2, duree: "60–75 min",
    exercices: [
      { nom: "Squat à la barre (ou hack squat)", series: "3 × 6–10", repos: "2–3 min", tip: "Au moins cuisses parallèles, dos gainé." },
      { nom: "Développé couché barre (ou haltères)", series: "3 × 6–10", repos: "2–3 min", tip: "Omoplates serrées, barre au bas des pecs." },
      { nom: "Rowing assis poulie basse", series: "3 × 8–12", repos: "2 min", tip: "Tire vers le nombril, 1 s de pause poitrine sortie." },
      { nom: "Leg curl assis", series: "3 × 10–12", repos: "1 min 30", tip: "Descente lente, 3 s." },
      { nom: "Élévations latérales haltères", series: "3 × 12–15", repos: "1 min", tip: "Léger, sans élan, coudes légèrement fléchis." },
      { nom: "Superset : curl barre EZ + extension triceps corde", series: "2 × 10–15 chacun", repos: "1 min 30 après le duo", tip: "Coudes fixes sur les deux." },
      { nom: "Mollets debout ou à la presse", series: "3 × 10–15", repos: "1 min", tip: "1–2 s d'étirement en bas." }
    ]
  },
  {
    id: "B", court: "Jeu · B", titre: "Séance B — chaîne arrière, dos, épaules",
    jour: "Jeudi matin", weekday: 4, duree: "60–75 min",
    exercices: [
      { nom: "Soulevé de terre roumain", series: "3 × 8–10", repos: "2–3 min", tip: "Dos neutre, fesses en arrière, barre collée aux jambes. Matin : échauffe-toi 5 min de plus." },
      { nom: "Tirage vertical prise large", series: "3 × 8–12", repos: "2 min", tip: "Tire vers le haut des pecs, sans te balancer." },
      { nom: "Développé militaire haltères assis (ou machine)", series: "3 × 8–10", repos: "2 min", tip: "Ne cambre pas, abdos serrés." },
      { nom: "Développé incliné haltères", series: "3 × 8–12", repos: "2 min", tip: "Banc à 30° environ." },
      { nom: "Leg extension", series: "3 × 12–15", repos: "1 min 30", tip: "1 s de contraction en haut." },
      { nom: "Élévations latérales poulie basse", series: "3 × 12–15", repos: "1 min", tip: "Un bras à la fois, tension continue." },
      { nom: "Oiseau à la machine (reverse pec deck)", series: "3 × 12–15", repos: "1 min", tip: "Arrière d'épaules, bras quasi tendus." }
    ]
  },
  {
    id: "C", court: "Sam · C", titre: "Séance C — machines et volume",
    jour: "Samedi", weekday: 6, duree: "60–75 min",
    exercices: [
      { nom: "Presse à cuisses", series: "3 × 10–12", repos: "2 min", tip: "Bas du dos collé au dossier, genoux dans l'axe des pieds." },
      { nom: "Chest press machine (ou dips)", series: "3 × 8–12", repos: "2 min", tip: "Amplitude complète, épaules basses." },
      { nom: "Rowing haltère un bras", series: "3 × 8–12 par bras", repos: "1 min 30", tip: "Tire le coude vers la hanche." },
      { nom: "Leg curl allongé", series: "3 × 10–12", repos: "1 min 30", tip: "Variante différente de la séance A." },
      { nom: "Élévations latérales haltères", series: "3 × 12–15", repos: "1 min", tip: "Dernière série jusqu'à l'échec possible." },
      { nom: "Superset : curl incliné + extension triceps au-dessus de la tête", series: "2 × 10–12 chacun", repos: "1 min 30 après le duo", tip: "Bras étirés en bas du mouvement." },
      { nom: "Mollets assis ou debout", series: "3 × 10–15", repos: "1 min", tip: "Mouvement lent, pas de rebond." }
    ]
  },
  {
    id: "gainage", court: "Gainage", titre: "Gainage quotidien",
    jour: "Tous les jours (après la séance les jours de salle)", weekday: null, duree: "10 min",
    exercices: [
      { nom: "Planche sur les avant-bras", series: "2–3 × 30–60 s", repos: "45 s", tip: "60 s faciles ? Durcis l'exercice plutôt que de tenir plus longtemps." },
      { nom: "Gainage latéral", series: "2 par côté × 20–45 s", repos: "30 s", tip: "Hanches hautes, corps aligné." },
      { nom: "Dead bug (ou hollow hold)", series: "2 × 8–10 par côté (ou 20–30 s)", repos: "45 s", tip: "Bas du dos plaqué au sol." }
    ]
  }
];

// ---------------------------------------------------------------
// Stockage (localStorage, protégé par try/catch)
// ---------------------------------------------------------------
const KEY_CURRENT = "muscu.current.v1";
const KEY_HISTORY = "muscu.history.v1";
const memory = {};

function load(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return key in memory ? memory[key] : fallback;
  }
}
function save(key, value) {
  memory[key] = value;
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* stockage indisponible */ }
}

let current = load(KEY_CURRENT, {});   // { sessionId: { index: { done, perf } } }
let history = load(KEY_HISTORY, []);   // [{ id, date, sessionId, titre, exos:[{nom, done, perf}] }]

// ---------------------------------------------------------------
// Utilitaires
// ---------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayISO = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};
const fmtDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

function stateOf(sessionId) {
  if (!current[sessionId]) current[sessionId] = {};
  return current[sessionId];
}
function lastPerf(sessionId, nom) {
  for (let i = history.length - 1; i >= 0; i--) {
    const h = history[i];
    if (h.sessionId !== sessionId) continue;
    const ex = h.exos.find((e) => e.nom === nom);
    if (ex && ex.perf) return { perf: ex.perf, date: h.date };
  }
  return null;
}
function hasProgress(sessionId) {
  const st = current[sessionId] || {};
  return Object.values(st).some((v) => v.done || (v.perf && v.perf.trim()));
}

// ---------------------------------------------------------------
// Affichage
// ---------------------------------------------------------------
const todaySession = PROGRAMME.find((s) => s.weekday === new Date().getDay());
let activeId = todaySession ? todaySession.id : "gainage";

function renderTabs() {
  $("tabs").innerHTML = PROGRAMME.map((s) =>
    `<button data-id="${s.id}" class="${s.id === activeId ? "active" : ""}">${esc(s.court)}${hasProgress(s.id) && s.id !== activeId ? '<span class="dot"></span>' : ""}</button>`
  ).join("");
  $("tabs").querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => { activeId = b.dataset.id; setStatus(""); render(); })
  );
}

function renderSession() {
  const s = PROGRAMME.find((x) => x.id === activeId);
  const st = stateOf(s.id);
  $("title").textContent = s.titre;
  $("subtitle").textContent = s.jour + " · " + s.duree;

  $("list").innerHTML = s.exercices.map((ex, i) => {
    const v = st[i] || {};
    const last = lastPerf(s.id, ex.nom);
    return `
      <div class="ex ${v.done ? "done" : ""}" data-i="${i}">
        <label class="top">
          <input type="checkbox" ${v.done ? "checked" : ""}>
          <div>
            <div class="name">${esc(ex.nom)}</div>
            <div class="chips">
              <span class="chip main">${esc(ex.series)}</span>
              <span class="chip">repos ${esc(ex.repos)}</span>
            </div>
            <div class="tip">${esc(ex.tip)}</div>
          </div>
        </label>
        <div class="perf">
          <input type="text" placeholder="Charge et reps, ex. 40 kg : 10 / 9 / 8" value="${esc(v.perf || "")}">
          ${last ? `<div class="last">Dernière fois (${esc(fmtDate(last.date))}) : ${esc(last.perf)}</div>` : ""}
        </div>
      </div>`;
  }).join("");

  $("list").querySelectorAll(".ex").forEach((card) => {
    const i = card.dataset.i;
    card.querySelector("input[type=checkbox]").addEventListener("change", (e) => {
      st[i] = Object.assign({}, st[i], { done: e.target.checked });
      card.classList.toggle("done", e.target.checked);
      save(KEY_CURRENT, current);
      updateProgress();
    });
    card.querySelector(".perf input").addEventListener("input", (e) => {
      st[i] = Object.assign({}, st[i], { perf: e.target.value });
      save(KEY_CURRENT, current);
    });
  });
  updateProgress();
}

function updateProgress() {
  const s = PROGRAMME.find((x) => x.id === activeId);
  const st = stateOf(s.id);
  const done = s.exercices.filter((_, i) => st[i] && st[i].done).length;
  $("count").textContent = done + " / " + s.exercices.length;
  $("progress").style.width = (100 * done / s.exercices.length) + "%";
}

function renderWeek() {
  // Semaine du lundi au dimanche
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const labels = ["L", "M", "M", "J", "V", "S", "D"];
  let html = "";
  for (let k = 0; k < 7; k++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + k);
    const iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const sessions = history.filter((h) => h.date === iso && h.sessionId !== "gainage");
    const on = sessions.length > 0;
    const label = on ? sessions.map((h) => h.sessionId === "maison" ? "M" : h.sessionId).join("") : d.getDate();
    html += `<div class="day ${iso === todayISO() ? "today" : ""}">${labels[k]}<b class="${on ? "on" : ""}">${esc(label)}</b></div>`;
  }
  $("week").innerHTML = html;
}

function renderHistory() {
  if (!history.length) {
    $("history").innerHTML = '<div class="muted">Aucune séance enregistrée pour l\'instant.</div>';
    return;
  }
  $("history").innerHTML = history.slice().reverse().slice(0, 60).map((h) => {
    const done = h.exos.filter((e) => e.done).length;
    return `
      <details class="entry">
        <summary><span>${esc(fmtDate(h.date))} · ${esc(h.titre)}</span><span class="muted">${done}/${h.exos.length}</span></summary>
        <ul>${h.exos.map((e) => `<li class="${e.done ? "" : "skip"}">${e.done ? "✓" : "✗"} ${esc(e.nom)}${e.perf ? " — " + esc(e.perf) : ""}</li>`).join("")}</ul>
        <button class="del" data-id="${esc(h.id)}">Supprimer cette séance</button>
      </details>`;
  }).join("");
  $("history").querySelectorAll(".del").forEach((b) =>
    b.addEventListener("click", () => {
      history = history.filter((h) => h.id !== b.dataset.id);
      save(KEY_HISTORY, history);
      render();
    })
  );
}

function setStatus(msg, kind) {
  $("status").textContent = msg;
  $("status").className = "status " + (kind || "");
}

function render() {
  renderTabs();
  renderSession();
  renderWeek();
  renderHistory();
}

// ---------------------------------------------------------------
// Actions
// ---------------------------------------------------------------
$("finish").addEventListener("click", () => {
  const s = PROGRAMME.find((x) => x.id === activeId);
  const st = stateOf(s.id);
  const exos = s.exercices.map((ex, i) => ({
    nom: ex.nom,
    done: !!(st[i] && st[i].done),
    perf: (st[i] && st[i].perf ? st[i].perf.trim() : "")
  }));
  if (!exos.some((e) => e.done || e.perf)) {
    setStatus("Coche au moins un exercice avant de terminer la séance.", "warn");
    return;
  }
  history.push({ id: Date.now().toString(36), date: todayISO(), sessionId: s.id, titre: s.titre, exos });
  save(KEY_HISTORY, history);
  current[s.id] = {};
  save(KEY_CURRENT, current);
  const done = exos.filter((e) => e.done).length;
  render();
  setStatus("Séance enregistrée : " + done + "/" + exos.length + " exercices. Bien joué.", "ok");
});

$("reset").addEventListener("click", () => {
  current[activeId] = {};
  save(KEY_CURRENT, current);
  render();
  setStatus("Séance remise à zéro.", "");
});

$("export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({ history, current }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "muscu-historique-" + todayISO() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
});

$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.history)) throw new Error("format");
      const known = new Set(history.map((h) => h.id));
      data.history.forEach((h) => { if (!known.has(h.id)) history.push(h); });
      history.sort((a, b) => a.date.localeCompare(b.date));
      save(KEY_HISTORY, history);
      render();
      setStatus("Historique importé.", "ok");
    } catch (err) {
      setStatus("Fichier non reconnu.", "warn");
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});

render();
</script>
</body>
</html>
